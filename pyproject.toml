[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-m5-bench"
version = "0.2.0"
description = "Reproducible CPU vs Apple Silicon GPU benchmarks for classical machine learning"
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = "MIT"
dependencies = [
    "numpy>=2",
    "scikit-learn==1.9.1",
    "threadpoolctl",
    "psutil",
    "pydantic>=2",
    "pyyaml",
    "matplotlib",
    "mlx-learn==0.1.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dashboard = ["streamlit", "pandas"]

[project.scripts]
mlx-m5-bench = "mlx_m5_bench.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "types-PyYAML"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
markers = ["apple_gpu: requires usable Apple Metal"]
addopts = "-m 'not apple_gpu'"
